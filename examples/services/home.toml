# Home automation, files and dashboards.

[[services]]
id = "home-assistant"
name = "Home Assistant"
url = "http://192.168.1.20:8123"
addresses = { local = "http://192.168.1.20:8123", internet = "https://home.example.com" }
group = "Home"
icon = "catalog:home-assistant"
public = true
notes = "Probed on `/manifest.json`, which answers without a login. Default port 8123."
probe = { path = "/manifest.json", environment = "local" }

[[services]]
id = "nextcloud"
name = "Nextcloud"
url = "https://cloud.example.com"
group = "Home"
icon = "catalog:nextcloud"
public = true
notes = "`/status.php` reports `installed` and `maintenance`; a maintenance page answers 503."
probe = { path = "/status.php" }

[[services]]
id = "grafana"
name = "Grafana"
url = "http://192.168.1.21:3000"
group = "Home"
icon = "catalog:grafana"
environments = ["local", "vpn"]
notes = "Health endpoint `/api/health`. Default port 3000."
probe = { path = "/api/health" }
