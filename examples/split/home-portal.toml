# A complete home-portal setup. Each part lives in its own file beside this one:
#
#   home-portal.toml   this file: the interface, network, environments and modules
#   services.toml      the services and how they are probed
#   dashboard.toml     the home page: its sections and widgets
#   automations.toml   scripts run on a schedule or on the portal's events
#   webhooks.toml      addresses other systems call to start a script or an event
#   workflows/         runs of several steps, one file per workflow (see ../README.md)
#   notifications.toml when and where the portal tells you a service went down
#   proxy.toml         publishing the portal and services through Caddy
#   users.toml         people who may sign in (created when you add the first one)
#   secrets.toml       tokens and passwords, mode 0600 (copy secrets.example.toml)
#   scripts/           the scripts automations may run, 0755 or stricter
#
# The interface writes each part to its own file and never back into this one. A [files]
# table here may move any part elsewhere in this directory, for example
#   [files]
#   workflows = "flows/"
# and the portal keeps that choice as written. An older all-in-one file is split this way
# at the first start, with a .previous copy of every file it rewrites.
#
# Copy the directory, add a user (see below) and start the portal with
#   HOME_PORTAL_CONFIG=/path/to/split/home-portal.toml home-portal
#
# People who may sign in go in users.toml. Create the hash with:  home-portal password-hash
# [[users]]
# name = "admin"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."

# Russian for visitors whose browser asks for none of en, ru, es; each visitor can still
# switch in the header.
[interface]
default_language = "ru"

[network]
address = "127.0.0.1"
port = 8080
# With [proxy] below, people reach the portal through Caddy at proxy.portal_host.
# public_url = "https://portal.home.example.com"
# Caddy runs on this host and forwards from loopback; its X-Forwarded-For is believed.
trusted_proxies = ["127.0.0.1"]

# Where a visitor is. Everyone outside these ranges is "internet".
[environments.local]
networks = ["192.168.1.0/24"]

[environments.vpn]
networks = ["10.8.0.0/24"]

# The optional parts: the proxy is on; automations and webhooks are on by default. DNS
# stays off. Management → Modules switches them.
[modules]
proxy = true
workflows = true
