# Workflows: runs of several steps that an automation, a webhook or "Run now" starts.
#
# Switch them on with [modules] workflows = true (they need automations). Management →
# Workflows edits them on a diagram; saving from there rewrites a workflow's steps as a
# whole, so comments inside steps are lost, while comments like these above an entry stay.
#
# Every text is a template: {{inputs.x}}, {{vars.x}}, {{steps.<id>.<field>}} (for example
# {{steps.ping.json.state}}), {{event.<field>}}, {{loop.item}}, {{loop.index}},
# {{secrets.<key>}}, which is sent as it is but shown as *** in the journal, and the portal's
# own values, read when the step starts: {{portal.services.<id>.<field>}} (name, group, url,
# address, state, since, latency_milliseconds, public), {{portal.services}} as a list,
# {{portal.network.address}}, .port and .url, {{portal.modules.<name>.is_enabled}} and
# {{portal.environments}}.
# A name may be followed by filters, applied left to right:
# {{steps.list.json.disks | pluck("name") | join(", ") | upper}}, {{vars.note | default("none")}}.
#
# A run is bounded: timeout_seconds (300 unless set), 1000 steps, 100 iterations per loop,
# 4 parallel branches, 8 levels of nesting and 4 levels of calls.

# Bring a service back: probe it, and while it is not up call its restart API up to three
# times, then say how it ended.
[[workflows]]
id = "revive"
title = "Revive a service"
description = "Probe, retry the restart API three times, then report"
tags = ["media"]
inputs = ["service"]
timeout_seconds = 600

[[workflows.steps]]
id = "first_probe"
label = "Probe it now"
kind = "probe"
service = "{{inputs.service}}"

[[workflows.steps]]
id = "down"
label = "Is it down?"
kind = "if"
condition = { left = "{{steps.first_probe.state}}", op = "!=", right = "up" }

[[workflows.steps.then]]
id = "retry"
label = "Try three times"
kind = "loop"
repeat = 3

[[workflows.steps.then.body]]
id = "restart"
label = "Ask the host to restart it"
kind = "http"
method = "POST"
url = "http://192.168.1.10:9000/restart/{{inputs.service}}"
headers = { Authorization = "Bearer {{secrets.telegram_token}}" }
fail_on_error = false

[[workflows.steps.then.body]]
id = "settle"
kind = "wait"
seconds = 20

[[workflows.steps.then.body]]
id = "again"
kind = "probe"
service = "{{inputs.service}}"

[[workflows.steps.then.body]]
id = "back"
kind = "if"
condition = { left = "{{steps.again.state}}", op = "==", right = "up" }
then = [{ id = "done", kind = "stop", outcome = "succeeded", reason = "{{inputs.service}} is back" }]

# notify sends through every enabled notification channel; channel = "telegram" picks one.
# The old kind = "telegram" still loads and is saved as notify.
[[workflows.steps]]
id = "report"
kind = "notify"
title = "{{inputs.service}}"
text = "{{inputs.service}}: {{steps.first_probe.state}}, restart tries: {{steps.retry.iterations}}"

# Check the NAS and the router at the same time, keep the router's status, run a local
# script with it, and call "revive" for the NAS when it looks bad.
[[workflows]]
id = "morning-check"
title = "Morning check"
tags = ["media"]

[[workflows.steps]]
id = "both"
kind = "parallel"
branches = [
  [{ id = "nas_state", kind = "status", service = "nas" }],
  [{ id = "router_state", kind = "status", service = "router" }],
]

[[workflows.steps]]
id = "remember"
kind = "set"
variable = "router"
value = "{{steps.router_state.state}}"

[[workflows.steps]]
id = "log"
kind = "script"
script = "echo-event.sh"
args = ["morning", "--", "{{vars.router}}"]
timeout_seconds = 30

[[workflows.steps]]
id = "nas_bad"
kind = "if"
condition = { any = [
  { left = "{{steps.nas_state.state}}", op = "==", right = "down" },
  { left = "{{steps.nas_state.state}}", op = "==", right = "unreadable" },
] }
then = [{ id = "call_revive", kind = "workflow", workflow = "revive", inputs = { service = "nas" } }]

# Report the failing disks of the NAS: read its disk list, keep the unhealthy ones, and send
# their names on one line. A transform applies its operations in order; inside filter and
# map, {{item}} is the current element and {{index}} its position.
[[workflows]]
id = "failing-disks"
title = "Failing disks"

[[workflows.steps]]
id = "list"
kind = "http"
url = "http://nas.lan/api/disks"
response_sample = '{"disks": [{"name": "sda", "health": "ok"}, {"name": "sdb", "health": "failing"}]}'

[[workflows.steps]]
id = "bad"
kind = "transform"
input = "{{steps.list.json.disks}}"
operations = [
  { op = "filter", where = { left = "{{item.health}}", op = "!=", right = "ok" } },
  { op = "pluck", args = ["name"] },
  { op = "join", args = [", "] },
]

[[workflows.steps]]
id = "tell"
kind = "notify"
text = "Failing disks: {{steps.bad.value | default(\"none\")}} ({{steps.list.json.disks | length}} in all)"

# Check a list of hosts: a typed list input with a default, a dictionary built from rows, the
# names cleaned element by element, the report handed to a script through its environment and
# its standard input, and an automation started with an event field of our own. Inputs may be
# plain names or tables with type (text, number, boolean, list, object), default and description.
[[workflows]]
id = "check-hosts"
title = "Check hosts"
inputs = [{ name = "hosts", type = "list", default = ["nas", "router"], description = "Hosts to check" }, "note"]

[[workflows.steps]]
id = "names"
kind = "transform"
input = "{{inputs.hosts | join(',')}}"
operations = [
  { op = "split", args = [","] },
  { op = "each", operations = [{ op = "trim" }, { op = "upper" }] },
]

[[workflows.steps]]
id = "report"
kind = "set"
variable = "report"
object = { hosts = "{{steps.names.value}}", count = "{{inputs.hosts | length}}", note = "{{inputs.note | default('none')}}" }

[[workflows.steps]]
id = "log"
kind = "script"
script = "echo-event.sh"
args = ["hosts"]
env = { HOSTS = "{{steps.names.value | join(' ')}}" }
stdin = "{{vars.report}}"

# An automation step queues an automation as "Run now" would; its fields replace the event's.
# With wait = true it waits for the outcome. A workflow cannot start the automation that
# started it, and such chains stop at 4.
[[workflows.steps]]
id = "restart"
kind = "automation"
automation = "restart-jellyfin"
fields = { "service.id" = "jellyfin" }
wait = false

# Report the portal itself: a loop takes exactly one of repeat, for_each and while; here it
# goes over every service, and the note reads the NAS directly and a module switch.
[[workflows]]
id = "portal-report"
title = "Portal report"

[[workflows.steps]]
id = "each"
kind = "loop"
for_each = "{{portal.services}}"

[[workflows.steps.body]]
id = "line"
kind = "set"
variable = "last"
value = "{{loop.item.name}}: {{loop.item.state}}"

# log writes a message into the run's trace (info, warning or error) and never stops the run.
# Every step's trace entry also keeps what its templates gave and what it did.
[[workflows.steps.body]]
id = "note"
kind = "log"
message = "{{loop.item.id}} is {{loop.item.state}}"
level = "info"

[[workflows.steps]]
id = "tell"
kind = "notify"
text = "NAS is {{portal.services.nas.state}}, users module on: {{portal.modules.users.is_enabled}}, portal at {{portal.network.url}}"
