# Copy to secrets.toml and give it mode 0600:  chmod 600 secrets.toml
# Values never leave this file and never appear in an API answer.

[secrets]
# The bot token from @BotFather, named by notifications.telegram.secret.
# telegram_token = "123456789:AA..."

# The calendar's token (sent as a bearer token), or its password when the URL names a user.
# calendar_password = "..."
