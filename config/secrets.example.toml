# Secrets, kept apart from the settings they belong to.
# Copy to secrets.toml beside home-portal.toml (config/ in this repository), add it to
# `include`, and give it mode 0600 - the portal refuses to start when anyone else can read it:
#
#   chmod 600 secrets.toml
#
# Values never leave this file: they are stripped from the merged configuration,
# are never part of an API response, and /api/secrets shows only the names and
# whether each one is set.

[secrets]
# The bot token of @BotFather, named by notifications.telegram.secret.
# telegram_token = "123456789:AA..."

# A password for a calendar behind basic authentication, named by the widget's
# settings.secret.
# calendar_password = "..."
